<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases de Messias</title>
    
    <!-- CSS com parâmetro para forçar atualização e evitar cache -->
    <link rel="stylesheet" href="./style.css?v=200">
</head>
<body>

    <header>
        <div class="container">
            <h1>📖 Frases de Messias</h1>
            <input type="text" id="pesquisa" placeholder="Pesquisar frases, autor ou categoria...">
        </div>
    </header>

    <main class="container">
        <!-- FRASE DO DIA -->
        <section class="hero">
            <h2>✨ Frase do Dia</h2>
            <blockquote id="fraseDia">"Carregando frase..."</blockquote>
        </section>

        <!-- CONTAINER ONDE OS CARDS SERÃO GERADOS -->
        <section id="listaFrases"></section>
    </main>

    <button id="temaBtn" type="button">🌙 Modo Escuro</button>

    <footer>
        <p>&copy; Frases de Messias - Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT COM SUPORTE A MÓDULOS -->
    <script type="module" src="./script.js?v=200"></script>
</body>
</html>
