<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases de Messias</title>
    <link rel="stylesheet" href="./style.css?v=300">
</head>
<body>

    <header>
        <div class="container">
            <h1>📖 Frases de Messias</h1>
            <input type="text" id="pesquisa" placeholder="Pesquisar frases, autor ou categoria...">
        </div>
    </header>

    <main class="container">
        <!-- FRASE DO DIA -->
        <section class="hero">
            <h2>✨ Frase do Dia</h2>
            <blockquote id="fraseDia">"Carregando frase..."</blockquote>
        </section>

        <!-- SEÇÃO DE CATEGORIAS -->
        <section class="categorias">
            <h2>📂 Categorias em Destaque</h2>
            <div id="listaCategorias" class="gridCategorias"></div>
        </section>

        <!-- TODAS AS FRASES -->
        <section>
            <h2 style="margin: 20px 0 10px;">💬 Todas as Frases</h2>
            <div id="listaFrases"></div>
        </section>
    </main>

    <button id="temaBtn" type="button">🌙 Modo Escuro</button>

    <footer>
        <p>&copy; Frases de Messias - Todos os direitos reservados.</p>
    </footer>

    <script type="module" src="./script.js?v=300"></script>
</body>
</html>
