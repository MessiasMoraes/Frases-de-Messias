<body>

<header>
  <h1>❤️ Frases Favoritas</h1>
  <a href="index.html">← Voltar para a página inicial</a>
  <a href="comunidade.html">💬 Ir para a Comunidade</a>
</header>

<main id="listaFavoritos"></main>

<script>
const favoritos = (() => {
  try {
    const dados = JSON.parse(localStorage.getItem("favoritos") || "[]");
    return Array.isArray(dados) ? dados.filter(Boolean).map(item => typeof item === "string"
      ? { id: "", texto: item, autor: "Messias", imagem: "" }
      : item
    ) : [];
  } catch (_) {
    return [];
  }
})();
const lista = document.getElementById("listaFavoritos");

function escaparFavorito(valor = "") {
  return String(valor).replace(/[&<>'"]/g, caractere => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
  }[caractere]));
}

function chaveFavorito(frase) {
  const id = String(frase?.id || "").trim();
  return id ? `id:${id}` : `texto:${String(frase?.texto || "").trim()}`;
}

function renderizarFavoritos() {
  if (!favoritos.length) {
    lista.innerHTML = "<p class=\"semFavoritos\">Você ainda não salvou nenhuma frase.</p>";
    return;
  }
  lista.innerHTML = favoritos.map((frase, indice) => `
    <article class="favorito-salvo">
      ${frase.imagem ? `<img src="${escaparFavorito(frase.imagem)}" alt="" loading="lazy">` : ""}
      <div class="favorito-salvo-conteudo">
        <p class="favorito-salvo-texto">“${escaparFavorito(frase.texto || frase)}”</p>
        <p class="favorito-salvo-autor">— ${escaparFavorito(frase.autor || "Messias")}</p>
        <button type="button" data-remover-favorito="${indice}">Remover dos favoritos</button>
      </div>
    </article>
  `).join("");
}

lista.addEventListener("click", evento => {
  const botao = evento.target.closest("[data-remover-favorito]");
  if (!botao) return;
  const indice = Number(botao.dataset.removerFavorito);
  favoritos.splice(indice, 1);
  localStorage.setItem("favoritos", JSON.stringify(favoritos));
  renderizarFavoritos();
});

renderizarFavoritos();
</script>
